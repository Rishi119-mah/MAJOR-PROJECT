services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: fake-review-detection:latest
    container_name: fake_review_detection_api
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - PYTHONUNBUFFERED=1
    volumes:
      # Optional read-only dataset mount
      - ./data:/app/data:ro
      - ./outputs:/app/outputs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
