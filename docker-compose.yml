version: '3.8'

services:
  fake-review-detection-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fake_review_detection_api
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENVIRONMENT=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

